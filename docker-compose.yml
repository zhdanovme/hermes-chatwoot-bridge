name: hermes-chatwoot-bridge

services:
  bridge:
    build: .
    restart: unless-stopped
    environment:
      CHATWOOT_URL: ${CHATWOOT_URL:?Set CHATWOOT_URL}
      CHATWOOT_API_TOKEN: ${CHATWOOT_API_TOKEN:?Set CHATWOOT_API_TOKEN}
      CHATWOOT_WEBHOOK_SECRET: ${CHATWOOT_WEBHOOK_SECRET:-}
      HERMES_API_URL: ${HERMES_API_URL:?Set HERMES_API_URL}
      HERMES_API_KEY: ${HERMES_API_KEY:?Set HERMES_API_KEY}
      HERMES_MODEL: ${HERMES_MODEL:-hermes-agent}
      HERMES_INSTRUCTIONS_FILE: /app/config/employee.md
      WEBHOOK_TOLERANCE_SECONDS: ${WEBHOOK_TOLERANCE_SECONDS:-300}
      IDEMPOTENCY_DB: /app/data/idempotency.sqlite3
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - bridge_data:/app/data
      - ./config/employee.md:/app/config/employee.md:ro

volumes:
  bridge_data:
